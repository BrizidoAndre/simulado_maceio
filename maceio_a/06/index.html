<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: wiggle 2s infinite ease-in-out alternate;
            overflow: hidden;
        }

        @keyframes wiggle {
            from {
                transform: rotateZ(25deg);
            }
            to {
                transform: rotateZ(-25deg);
            }
        }

        .scene {
            perspective: 1200px;
        }

        .globe {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
        }

        .circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid black;
            border-radius: 50%;
        }

        .circle-2 {
            transform: rotateY(45deg)
        }

        .circle-3 {
            transform: rotateY(90deg)
        }

        .circle-4 {
            transform: rotateY(135deg)
        }

        .globe {
            animation: rotate 5s infinite linear;
        }

        .stationary {
            animation: rotate 5s infinite linear reverse;
            background: white;
            overflow: hidden;
        }

        .stationary::after, .stationary::before {
            content: '';
            width: 100%;
            border: 1px solid black;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .stationary::after {
            height: 50%;
            border-radius: 50%;
            width: 150%;
            border-width: 2px;
        }

        @keyframes rotate {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="globe">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle stationary"></div>
    </div>
</div>
</body>
</html>
